name: Pipeline

on:
  pull_request:

jobs:
  ci:
    name: Vet, Lint, Test & Coverage
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}

    steps:
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.26.6'

      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}

      - name: Download dependencies
        run: go mod download

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Install counterfeiter
        run: go install github.com/maxbrunsfeld/counterfeiter/v6@v6.12.2

      - name: Run vet
        run: go vet $(go list ./... | grep -v /vendor/)

      - name: Run lint
        run: $GOPATH/bin/golangci-lint run

      - name: Validate generated fakes
        run: |
          go generate ./lib/provider/...
          if ! git diff --exit-code; then
            echo "Generated fakes are out of sync with interfaces. Run 'go generate ./lib/provider/...' and commit the result."
            exit 1
          fi

      - name: Run tests
        run: go test $(go list ./... | grep -v /vendor/) -race -timeout 90m
