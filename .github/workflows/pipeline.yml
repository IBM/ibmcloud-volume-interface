name: Pipeline

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    name: Vet, Lint, Test & Coverage
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          path: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Install counterfeiter
        run: go install github.com/maxbrunsfeld/counterfeiter/v6@v6.12.2

      - name: Check formatting
        run: |
          $GOPATH/bin/golangci-lint fmt --diff
          if ! git diff --exit-code; then
            echo "Code is not formatted. Run 'golangci-lint fmt' and commit the result."
            exit 1
          fi

      - name: Run vet
        run: go vet $(go list ./... | grep -v /vendor/)

      - name: Run lint
        run: $GOPATH/bin/golangci-lint run

      - name: Validate generated fakes
        run: |
          go generate ./lib/provider/... ./provider/local/...
          if ! git diff --exit-code; then
            echo "Generated fakes are out of sync with interfaces. Run 'go generate ./lib/provider/... ./provider/local/...' and commit the result."
            exit 1
          fi

      - name: Run tests with coverage
        run: go test $(go list ./... | grep -v /vendor/) -race -covermode=atomic -coverprofile=cover.out -timeout 90m

      - name: Install goveralls
        run: go install github.com/mattn/goveralls@v0.0.12

      - name: Send coverage
        run: $GOPATH/bin/goveralls -coverprofile=cover.out -service=github
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
